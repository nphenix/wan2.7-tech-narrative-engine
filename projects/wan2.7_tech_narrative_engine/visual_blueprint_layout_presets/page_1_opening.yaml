# 与 PAGE_DEFINITIONS 中 page_1_opening 的 zones 对齐；画幅 1700×980（与手迁 MCP SVG viewBox 同量级）。
# 画布正文须来自任务目录 page_contracts / page_visual_specs 等已定稿；regions.name、purpose、required_labels 仅几何与验收参考，勿原样写入图内。
page_id: page_1_opening
canvas:
  width: 1700
  height: 980
  view_box: "0 0 1700 980"
regions:
